<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="bulbasaurModel" src="models/bulbasaur.glb"></a-asset-item>
        <a-asset-item id="charmanderModel" src="models/charmander.glb"></a-asset-item>
         <a-asset-item id="squirtleModel" src="models/squirtle.glb"></a-asset-item>
      </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: ${customFields.libVersion}; objects: .clickable"></a-camera>


      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model class="clickable" rotation="0 0 0 " position="0 -0.5 0" scale="0.5 0.5 0.5" src="#bulbasaurModel">
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model class="clickable" rotation="0 0 0 " position="0 -0.5 0" scale="0.5 0.5 0.5" src="#charmanderModel">
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model class="clickable" rotation="0 0 0 " position="0 -0.5 0" scale="0.5 0.5 0.5" src="#squirtleModel">
      </a-entity>
    </a-scene>
  </body>
  <script>
    const models = document.querySelectorAll(".clickable");
    console.log(models);
    for (const model of models) { 
      model.addEventListener("click", () => model.setAttribute("animation", "property: rotation; to: 0 360 0; loop: true; dur: 10000"))
    }
  </script>
</html>
